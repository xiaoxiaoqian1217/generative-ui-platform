<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generative UI Platform Web Demo</title>
    <style>
      :root {
        font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
        color: #172033;
        background: #f4f6fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
      }

      button,
      textarea {
        font: inherit;
      }

      .page {
        width: min(960px, calc(100% - 32px));
        margin: 32px auto;
      }

      .panel {
        overflow: hidden;
        border: 1px solid #dfe4ee;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 12px 32px rgba(23, 32, 51, 0.08);
      }

      .header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        padding: 24px;
        border-bottom: 1px solid #e8ebf1;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }

      .description {
        margin: 0;
        color: #667085;
        line-height: 1.6;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        font-size: 14px;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #98a2b3;
      }

      .status.connected .status-dot {
        background: #12b76a;
      }

      .status.connecting .status-dot {
        background: #f79009;
      }

      .status.error .status-dot {
        background: #f04438;
      }

      .notice {
        margin: 16px 24px 0;
        padding: 12px 14px;
        border-radius: 10px;
        background: #fff7e6;
        color: #7a4d00;
        font-size: 14px;
        line-height: 1.5;
      }

      .messages {
        min-height: 420px;
        max-height: 55vh;
        overflow-y: auto;
        padding: 24px;
      }

      .empty {
        display: grid;
        min-height: 360px;
        place-items: center;
        color: #98a2b3;
      }

      .message {
        max-width: 78%;
        margin-bottom: 16px;
      }

      .message.user {
        margin-left: auto;
      }

      .message-meta {
        margin-bottom: 5px;
        color: #98a2b3;
        font-size: 12px;
      }

      .message.user .message-meta {
        text-align: right;
      }

      .bubble {
        padding: 12px 14px;
        border-radius: 12px;
        background: #f0f2f6;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .message.user .bubble {
        background: #175cd3;
        color: #ffffff;
      }

      .message.system .bubble {
        border: 1px dashed #d0d5dd;
        background: #ffffff;
        color: #667085;
      }

      .error-message {
        margin: 0 24px 16px;
        color: #b42318;
        font-size: 14px;
      }

      .composer {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        padding: 20px 24px 24px;
        border-top: 1px solid #e8ebf1;
      }

      textarea {
        min-height: 84px;
        resize: vertical;
        border: 1px solid #d0d5dd;
        border-radius: 10px;
        padding: 12px;
        outline: none;
      }

      textarea:focus {
        border-color: #175cd3;
        box-shadow: 0 0 0 3px rgba(23, 92, 211, 0.12);
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      button {
        min-width: 96px;
        border: 0;
        border-radius: 9px;
        padding: 10px 14px;
        cursor: pointer;
      }

      button.primary {
        background: #175cd3;
        color: #ffffff;
      }

      button.secondary {
        background: #eaecf0;
        color: #344054;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .endpoint {
        padding: 0 24px 20px;
        color: #667085;
        font-size: 12px;
        word-break: break-all;
      }

      @media (max-width: 640px) {
        .header,
        .composer {
          grid-template-columns: 1fr;
          flex-direction: column;
        }

        .actions {
          flex-direction: row;
        }

        .message {
          max-width: 92%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script>
      const { computed, createApp, nextTick, onBeforeUnmount, onMounted, ref } = Vue;

      createApp({
        setup() {
          const socket = ref(null);
          const connectionState = ref("disconnected");
          const errorMessage = ref("");
          const input = ref("");
          const messages = ref([]);
          const messageList = ref(null);
          const runtimeUrl = new URLSearchParams(window.location.search).get("ws") ||
            "ws://localhost:8200/ws/demo";

          const statusLabel = computed(() => ({
            connected: "已连接",
            connecting: "连接中",
            disconnected: "未连接",
            error: "连接失败",
          })[connectionState.value]);

          function appendMessage(message) {
            messages.value.push(message);
            nextTick(() => {
              if (messageList.value) {
                messageList.value.scrollTop = messageList.value.scrollHeight;
              }
            });
          }

          function connect() {
            socket.value?.close();
            connectionState.value = "connecting";
            errorMessage.value = "";

            const nextSocket = new WebSocket(runtimeUrl);
            socket.value = nextSocket;

            nextSocket.addEventListener("open", () => {
              connectionState.value = "connected";
            });

            nextSocket.addEventListener("message", (event) => {
              try {
                const message = JSON.parse(event.data);
                appendMessage({
                  id: message.messageId || crypto.randomUUID(),
                  role: message.type === "system_message" ? "system" : "agent",
                  content: message.content || "收到无法识别的空消息",
                });
              } catch (error) {
                errorMessage.value = "Runtime Host 返回了无法解析的消息。";
                console.error(error);
              }
            });

            nextSocket.addEventListener("close", () => {
              if (socket.value === nextSocket) {
                connectionState.value = "disconnected";
              }
            });

            nextSocket.addEventListener("error", () => {
              connectionState.value = "error";
              errorMessage.value = "无法连接 Agent Runtime Host，请确认服务已启动。";
            });
          }

          function sendMessage() {
            const content = input.value.trim();
            if (!content || socket.value?.readyState !== WebSocket.OPEN) {
              return;
            }

            const messageId = crypto.randomUUID();
            const message = {
              type: "user_message",
              messageId,
              content,
            };

            appendMessage({ id: messageId, role: "user", content });
            socket.value.send(JSON.stringify(message));
            input.value = "";
          }

          function handleKeyboard(event) {
            if (event.key === "Enter" && !event.shiftKey) {
              event.preventDefault();
              sendMessage();
            }
          }

          onMounted(connect);
          onBeforeUnmount(() => socket.value?.close());

          return {
            connect,
            connectionState,
            errorMessage,
            handleKeyboard,
            input,
            messageList,
            messages,
            runtimeUrl,
            sendMessage,
            statusLabel,
          };
        },
        template: `
          <main class="page">
            <section class="panel">
              <header class="header">
                <div>
                  <h1>Generative UI Platform Web Demo</h1>
                  <p class="description">验证 Vue Web 与 Agent Runtime Host 的 WebSocket 文本消息闭环。</p>
                </div>
                <div class="status" :class="connectionState">
                  <span class="status-dot"></span>
                  <span>{{ statusLabel }}</span>
                </div>
              </header>

              <p class="notice">
                当前未接入真实 Business Agent。返回内容由 Runtime Host 的 Mock WebSocket 通道生成。
              </p>

              <div ref="messageList" class="messages">
                <div v-if="messages.length === 0" class="empty">发送一条消息开始验证</div>
                <article v-for="message in messages" :key="message.id" class="message" :class="message.role">
                  <div class="message-meta">
                    {{ message.role === 'user' ? '用户' : message.role === 'system' ? '系统' : 'Runtime Host' }}
                  </div>
                  <div class="bubble">{{ message.content }}</div>
                </article>
              </div>

              <p v-if="errorMessage" class="error-message">{{ errorMessage }}</p>

              <div class="composer">
                <textarea
                  v-model="input"
                  :disabled="connectionState !== 'connected'"
                  placeholder="输入要发送给 Runtime Host 的文本"
                  @keydown="handleKeyboard"
                ></textarea>
                <div class="actions">
                  <button class="primary" :disabled="connectionState !== 'connected' || !input.trim()" @click="sendMessage">
                    发送
                  </button>
                  <button class="secondary" :disabled="connectionState === 'connecting'" @click="connect">
                    重新连接
                  </button>
                </div>
              </div>

              <div class="endpoint">WebSocket：{{ runtimeUrl }}</div>
            </section>
          </main>
        `,
      }).mount("#app");
    </script>
  </body>
</html>
