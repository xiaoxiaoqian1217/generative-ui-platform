pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc}"
      run: pnpm biome check {staged_files}
    markdown:
      glob: "*.md"
      run: pnpm markdownlint-cli2 {staged_files}
commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
