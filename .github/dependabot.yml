version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: docker
    directory: "/apps/ui-compiler-agent"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/apps/interaction-gateway"
    schedule:
      interval: weekly
