name: Feature request
description: Propose a scoped capability
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope / out of scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Architecture checks
      options:
        - label: This directly serves the current SACS interoperability, map interaction validation, or Dynamic A2UI roadmap.
          required: true
        - label: This respects the scope, dependency, and feature admission rules in AGENTS.md.
          required: true
