name: Documentation review
description: Request human or AI-assisted review of requirements, ADRs, or contracts
title: "docs: review "
labels: ["documentation"]
body:
  - type: input
    id: document
    attributes:
      label: Document path
      placeholder: REQUIREMENTS.md
    validations:
      required: true
  - type: textarea
    id: focus
    attributes:
      label: Review focus
      description: Correctness, ambiguity, scope, contracts, security, or readability.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision needed
    validations:
      required: true
