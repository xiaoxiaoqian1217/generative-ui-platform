name: Bug report
description: Report a reproducible defect
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened and what was expected?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps, fixtures, logs, or failing tests.
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - ui-compiler-core
        - ui-compiler-service
        - contracts
        - CI/CD or documentation
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
