name: Docs
on:
  pull_request:
    paths:
      - "**/*.md"
      - "cspell.json"
      - ".markdownlint-cli2.yaml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-review:
    name: docs-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable && corepack prepare pnpm@10.13.1 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm docs:check
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --max-retries 2 --exclude localhost --exclude 127.0.0.1 "**/*.md"
          fail: true
