name: Refresh PR 191 lockfile

on:
  push:
    branches:
      - dependabot/npm_and_yarn/openai-7.4.0

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate
      - name: Add nanoid security override
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pnpm-workspace.yaml")
          text = path.read_text()
          override = '  "nanoid@<3.3.17": 3.3.17\n'
          if override not in text:
              needle = '  "vitest@<3.2.6": 3.2.6\n'
              if needle not in text:
                  raise SystemExit("Expected overrides anchor not found")
              text = text.replace(needle, needle + override, 1)
              path.write_text(text)
          PY
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Verify production audit
        run: pnpm audit --prod --audit-level=high
      - name: Commit generated lockfile
        run: |
          rm .github/workflows/refresh-pr191-lockfile.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-workspace.yaml pnpm-lock.yaml .github/workflows/refresh-pr191-lockfile.yml
          git commit -m "fix(deps): override vulnerable nanoid version"
          git push origin HEAD:${GITHUB_REF_NAME}
