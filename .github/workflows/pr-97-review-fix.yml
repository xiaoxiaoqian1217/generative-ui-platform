name: Apply PR 97 review fix

on:
  push:
    branches:
      - codex/task-001-platform-contracts

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/task-001-platform-contracts
          fetch-depth: 0

      - name: Patch validator and tests
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          validation_path = Path("packages/runtime-contract/src/validation.ts")
          validation = validation_path.read_text(encoding="utf-8")
          old_validator = '''export const validateRuntimeWebSocketOutboundMessage = createValidator<
            RuntimeWebSocketOutboundMessage,
            "RUNTIME_WEBSOCKET_MESSAGE_INVALID"
          >(
            runtimeWebSocketOutboundMessageSchema,
            "RUNTIME_WEBSOCKET_MESSAGE_INVALID",
            "Runtime WebSocket Outbound Message",
            [runtimeRunResultSchema, runtimeActionResultSchema],
          );
          '''
          new_validator = '''const validateRuntimeWebSocketOutboundMessageEnvelope = createValidator<
            RuntimeWebSocketOutboundMessage,
            "RUNTIME_WEBSOCKET_MESSAGE_INVALID"
          >(
            runtimeWebSocketOutboundMessageSchema,
            "RUNTIME_WEBSOCKET_MESSAGE_INVALID",
            "Runtime WebSocket Outbound Message",
            [runtimeRunResultSchema, runtimeActionResultSchema],
          );

          export function validateRuntimeWebSocketOutboundMessage(
            input: unknown,
          ): ValidationResult<
            RuntimeWebSocketOutboundMessage,
            "RUNTIME_WEBSOCKET_MESSAGE_INVALID"
          > {
            const result = validateRuntimeWebSocketOutboundMessageEnvelope(input);
            if (!result.success) {
              return result;
            }

            if (
              result.value.type === "runtime.run.result" ||
              result.value.type === "runtime.action.result"
            ) {
              return (
                validatePresentationCorrelation(
                  result.value.payload,
                  "RUNTIME_WEBSOCKET_MESSAGE_INVALID",
                  "Runtime WebSocket Outbound Message",
                ) ?? result
              );
            }

            return result;
          }
          '''
          if old_validator not in validation:
              raise SystemExit("Expected outbound validator block was not found")
          validation_path.write_text(
              validation.replace(old_validator, new_validator),
              encoding="utf-8",
          )

          test_path = Path("packages/runtime-contract/test/index.test.ts")
          tests = test_path.read_text(encoding="utf-8")
          marker = '\n});\n'
          if not tests.endswith(marker):
              raise SystemExit("Unexpected test file ending")
          regression_test = '''

            it("enforces Presentation correlation for WebSocket result payloads", () => {
              expect(
                validateRuntimeWebSocketOutboundMessage({
                  type: "runtime.run.result",
                  payload: {
                    protocolVersion: "1.0",
                    requestId: "request-1",
                    threadId: "thread-1",
                    runId: "run-1",
                    presentationRequestId: "presentation-expected",
                    status: "completed",
                    presentation: completedPresentation,
                  },
                }),
              ).toMatchObject({
                success: false,
                error: {
                  code: "RUNTIME_WEBSOCKET_MESSAGE_INVALID",
                  constraint: "presentation-request-correlation-consistency",
                },
              });

              expect(
                validateRuntimeWebSocketOutboundMessage({
                  type: "runtime.action.result",
                  payload: {
                    protocolVersion: "1.0",
                    requestId: "request-2",
                    threadId: "thread-1",
                    runId: "run-1",
                    actionId: "confirm-patrol",
                    presentationRequestId: "presentation-expected",
                    status: "completed",
                    presentation: completedPresentation,
                  },
                }),
              ).toMatchObject({
                success: false,
                error: {
                  code: "RUNTIME_WEBSOCKET_MESSAGE_INVALID",
                  constraint: "presentation-request-correlation-consistency",
                },
              });
            });
          '''
          tests = tests[:-len(marker)] + regression_test + marker
          test_path.write_text(tests, encoding="utf-8")

          Path(".github/workflows/pr-97-review-fix.yml").unlink()
          PY

      - name: Commit review fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/runtime-contract/src/validation.ts \
            packages/runtime-contract/test/index.test.ts \
            .github/workflows/pr-97-review-fix.yml
          git commit -m "fix(runtime-contract): validate WebSocket result correlation"
          git push origin HEAD:codex/task-001-platform-contracts
