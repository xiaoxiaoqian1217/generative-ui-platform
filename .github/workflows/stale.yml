name: Stale
on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          exempt-issue-labels: "security,roadmap,architecture"
          stale-issue-message: "该 Issue 60 天没有更新。请补充当前状态，否则将在 14 天后关闭。"
          stale-pr-message: "该 PR 30 天没有更新。请更新或说明阻塞项。"
