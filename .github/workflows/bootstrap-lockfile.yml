name: Bootstrap lockfile
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable && corepack prepare pnpm@10.13.1 --activate
      - run: pnpm install --no-frozen-lockfile
      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: add pnpm lockfile"
          title: "chore: add pnpm lockfile"
          body: "Generated by the bootstrap workflow."
          branch: automation/bootstrap-lockfile
          add-paths: pnpm-lock.yaml
