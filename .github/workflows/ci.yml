name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate
      - name: Install dependencies and refresh lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Validate workspace
        run: pnpm validate
      - name: Commit generated lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/init-copilotkit-runtime-host'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git add pnpm-lock.yaml .github/workflows/ci.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit -m "chore: update pnpm lockfile"
          git push origin HEAD:agent/init-copilotkit-runtime-host
