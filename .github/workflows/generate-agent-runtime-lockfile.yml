name: Generate agent runtime lockfile

on:
  pull_request:
    paths:
      - apps/agent-runtime-host/package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/generate-agent-runtime-lockfile.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          git commit -m "chore: update pnpm lockfile"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
