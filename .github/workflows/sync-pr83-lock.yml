name: Sync PR 83 Lockfile

on:
  push:
    branches:
      - agent/init-web-demo
    paths:
      - .github/workflows/sync-pr83-lock.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/init-web-demo
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate
      - name: Synchronize lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm install --no-frozen-lockfile
          git add pnpm-lock.yaml
          git commit -m "chore: sync runtime dependency lockfile"
          git push origin HEAD:agent/init-web-demo
