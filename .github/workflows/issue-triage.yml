name: Issue Triage
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const issue = context.payload.issue;
            const text = `${issue.title}\n${issue.body || ""}`.toLowerCase();
            const labels = [];
            if (/docs|document|requirement|adr/.test(text)) labels.push("documentation");
            if (/gateway|router|action/.test(text)) labels.push("area: gateway");
            if (/compiler|a2ui|markdown/.test(text)) labels.push("area: compiler-core");
            if (/contract|schema|catalog/.test(text)) labels.push("area: contracts");
            if (labels.length) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels });
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: "已进入自动分流。请确认范围、验收标准和所属模块；架构变更需要 ADR。",
            });
