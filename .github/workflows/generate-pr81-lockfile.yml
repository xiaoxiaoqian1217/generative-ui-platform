name: Generate PR 81 lockfile

on:
  push:
    branches:
      - agent/init-copilotkit-runtime-host
    paths:
      - .github/workflows/generate-pr81-lockfile.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/init-copilotkit-runtime-host
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate

      - name: Generate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-pr81-lockfile.yml
          git add pnpm-lock.yaml
          git -c core.hooksPath=/dev/null commit -m "chore: update pnpm lockfile"
          git push origin HEAD:agent/init-copilotkit-runtime-host
