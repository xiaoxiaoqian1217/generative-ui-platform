name: Seed Initial Issues
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const labels = [
              { name: "area: compiler-core", color: "1d76db" },
              { name: "area: compiler-agent", color: "5319e7" },
              { name: "area: gateway", color: "0052cc" },
              { name: "area: contracts", color: "006b75" },
              { name: "ci", color: "0e8a16" },
              { name: "codex-review", color: "7057ff" },
              { name: "codex-triage", color: "7057ff" },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...context.repo, ...label });
              }
            }

            const issues = [
              {
                title: "chore: finalize AG-UI and A2UI version ADR",
                labels: ["enhancement", "area: contracts"],
                body: "Create an ADR selecting the initial AG-UI and A2UI versions, compatibility policy, and adapter boundaries.\n\nAcceptance criteria:\n- Versions are explicit.\n- Upgrade policy is documented.\n- Core remains protocol-neutral.",
              },
              {
                title: "feat: implement deterministic Markdown AST parser",
                labels: ["enhancement", "area: compiler-core"],
                body: "Implement the Markdown parsing stage required by REQUIREMENTS.md.\n\nAcceptance criteria:\n- Headings, paragraphs, lists, tables, quotes, code, images, links, and rules are covered.\n- Dangerous HTML and URLs are rejected or sanitized.\n- Unit tests include malformed and oversized inputs.",
              },
              {
                title: "feat: implement Component Catalog runtime validation",
                labels: ["enhancement", "area: contracts"],
                body: "Add runtime validation for Catalog, component props, children, actions, and version compatibility.\n\nAcceptance criteria:\n- Validation cannot be disabled.\n- Stable error codes are returned.\n- Fallback order is tested.",
              },
              {
                title: "feat: implement Gateway agent registry and explicit routing",
                labels: ["enhancement", "area: gateway"],
                body: "Implement the MVP registry, targetAgentId routing, adapter interface, and Mock Agent integration.\n\nAcceptance criteria:\n- At least two Mock Agents route correctly.\n- Agent addresses are not exposed to frontend callers.\n- Timeouts and errors are standardized.",
              },
              {
                title: "test: build contract and end-to-end fixtures",
                labels: ["enhancement", "area: contracts"],
                body: "Create Mock Frontend, two Mock Business Agents, Catalog, Markdown, JSON, error, timeout, Action, and Surface fixtures.\n\nAcceptance criteria:\n- HTTP and AG-UI paths are tested.\n- Action routing and downgrade behavior are covered.\n- CI runs the suite.",
              },
            ];

            for (const issue of issues) {
              const existing = await github.rest.issues.listForRepo({
                ...context.repo,
                state: "all",
                per_page: 100,
              });
              if (existing.data.some((item) => item.title === issue.title)) continue;
              await github.rest.issues.create({ ...context.repo, ...issue });
            }
