name: Refresh release lockfile
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: refresh-release-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.actor == 'xiaoxiaoqian1217' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/release-hardening-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/release-hardening-audit
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.13.1 --activate
      - name: Align Vitest manifests
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, readdirSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const files = ["package.json"];
          for (const directory of ["apps", "packages"]) {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              if (entry.isDirectory()) files.push(join(directory, entry.name, "package.json"));
            }
          }
          for (const file of files) {
            const manifest = JSON.parse(readFileSync(file, "utf8"));
            if (manifest.devDependencies?.vitest !== undefined) {
              manifest.devDependencies.vitest = "3.2.6";
              writeFileSync(file, `${JSON.stringify(manifest, null, 2)}\n`, "utf8");
            }
          }
          EOF
      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated dependency state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-release-lockfile.yml
          git add package.json apps/*/package.json packages/*/package.json pnpm-workspace.yaml pnpm-lock.yaml
          git commit -m "chore: refresh secure dependency lockfile"
          git push origin HEAD:agent/release-hardening-audit
